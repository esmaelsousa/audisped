server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compactação
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Fallback SPA — Vue Router em history mode (refresh em /analisador, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html NUNCA pode ser cacheado: ele aponta para os chunks com hash.
    # Se o browser guardar um index.html antigo, ele pede chunks que já foram
    # deletados no redeploy -> 404 -> "Importing a module script failed" ->
    # menus (LMC, Injetor XML, CFOP...) não abrem. Sempre revalidar.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Assets com hash no nome -> cache longo (o hash muda a cada build)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
